name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shoppulse
          POSTGRES_PASSWORD: shoppulse
          POSTGRES_DB: shoppulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      POSTGRES_PASSWORD: shoppulse
      RAW_DIR: data/sample
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Pipeline ETL sur l'échantillon (deux fois pour prouver l'idempotence)
        run: |
          uv run python pipelines/etl_flow.py
          uv run python pipelines/etl_flow.py
      - name: Tests unitaires et tests de données
        run: uv run pytest --cov-fail-under=50
      - name: Entraînement des modèles sur l'échantillon
        run: uv run python pipelines/train.py
      - name: Build de l'image Docker de l'API
        run: docker build -f infra/Dockerfile -t shoppulse:ci .
      - name: Test de fumée du conteneur
        run: |
          docker run -d --name api -p 8000:8000 shoppulse:ci
          for i in $(seq 30); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf -X POST localhost:8000/predict/sentiment \
            -H 'content-type: application/json' -d '{"text": "Não recebi o produto"}'
          curl -sf localhost:8000/openapi.json > /dev/null
