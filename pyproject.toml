[project]
name = "shoppulse"
version = "0.1.0"
description = "ShopPulse : plateforme data & IA sur le jeu de données Olist"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prefect>=3.0",
    "tabulate>=0.10.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "fastapi>=0.150.0",
    "joblib>=1.6.0",
    "uvicorn[standard]>=0.54.0",
    "pyarrow>=26.0.0",
]

[dependency-groups]
analysis = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "streamlit>=1.66.1",
    "torch>=2.15.0",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoppulse"]

[tool.uv]
default-groups = ["dev", "analysis"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "pipelines", "dashboards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests qui nécessitent une base PostgreSQL chargée"]
addopts = "--cov=shoppulse --cov-report=term-missing"

[tool.prefect.server]
analytics_enabled = false

# PyTorch CPU sous Linux (CI, Docker) : évite plusieurs Go de dépendances CUDA.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
