[project]
name = "shoppulse"
version = "0.1.0"
description = "ShopPulse : plateforme data & IA sur le jeu de données Olist"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prefect>=3.0",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shoppulse"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
files = ["src", "pipelines"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: tests qui nécessitent une base PostgreSQL chargée"]
addopts = "--cov=shoppulse --cov-report=term-missing"

[tool.prefect.server]
analytics_enabled = false
