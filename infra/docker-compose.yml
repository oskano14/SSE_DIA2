# Lancement depuis la racine du dépôt : docker compose -f infra/docker-compose.yml up -d
name: shoppulse
services:
  db:
    image: postgres:16-alpine
    env_file: ../.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
